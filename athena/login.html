<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Atenea</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atenea"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#111315;color:#ECEDEF;font:15px/1.55 Geist,Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex}
.art{flex:1.1;position:relative;overflow:hidden;background:#0C0E10;border-right:1px solid #23272D;display:flex;align-items:center;justify-content:center}
.art img{width:min(62%,520px);opacity:.95}
.art p{position:absolute;left:48px;bottom:40px;margin:0;font-family:"Geist Mono",monospace;font-size:12px;color:#9AA0A8;letter-spacing:.04em}
.form{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 28px}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px}.brand b{font-size:28px;font-weight:600;letter-spacing:-.045em}
h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.025em;font-weight:600}
.sub{margin:10px 0 0;color:#9AA0A8;font-size:15px}
form{display:flex;flex-direction:column;gap:10px}
label{font-size:13px;font-weight:500;color:#C5C9CF}
.pw{position:relative}
input{width:100%;height:50px;border-radius:12px;border:1px solid #2C3036;background:#1B1E22;color:#ECEDEF;padding:0 48px 0 16px;font:400 16px Geist,sans-serif;outline:none}
input:focus{border-color:#7FC29B;box-shadow:0 0 0 3px rgba(127,194,155,.18)}
#eye{position:absolute;right:6px;top:7px;width:36px;height:36px;border:0;background:transparent;color:#9AA0A8;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#eye:hover{color:#ECEDEF}
#go{height:50px;border-radius:12px;border:0;background:#ECEDEF;color:#111315;font:600 16px Geist,sans-serif;margin-top:8px;cursor:pointer}
#go:disabled{opacity:.6}
#err{min-height:20px;color:#E5806F;font-size:14px}
.foot{display:flex;align-items:center;gap:8px;font:12px "Geist Mono",monospace;color:#9AA0A8}
.dot{width:7px;height:7px;border-radius:4px;background:#7FC29B}
@media (max-width:860px){.art{display:none}.form{align-items:center}}
</style></head>
<body>
<div class="art" aria-hidden="true"><img src="/brand/atenea-mark-dark.svg" alt=""><p>ATENEA · RUNS ON ZEUS</p></div>
<div class="form"><div class="box">
  <div class="brand"><img src="/brand/atenea-mark-dark.svg" alt=""><b>Atenea</b></div>
  <div><h1>Your intelligence, at home.</h1><p class="sub">Sign in to reach Atenea on ZEUS. You'll stay signed in on this device for 30 days.</p></div>
  <form id="f">
    <label for="pw">Password</label>
    <div class="pw"><input id="pw" type="password" autocomplete="current-password" autofocus required>
      <button type="button" id="eye" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button id="go" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
  <div class="foot"><span class="dot"></span>ZEUS · private network</div>
</div></div>
<script>
const $=s=>document.querySelector(s);
$('#eye').onclick=()=>{const i=$('#pw');i.type=i.type==='password'?'text':'password';i.focus();};
$('#f').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#err').textContent='';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
    if(r.ok){location.href='/';return;}
    const j=await r.json().catch(()=>({}));$('#err').textContent=j.detail||'Could not sign in';}
  catch(_){$('#err').textContent='Cannot reach ZEUS';}
  $('#go').disabled=false;$('#pw').select();};
</script></body></html>
