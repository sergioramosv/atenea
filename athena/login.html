<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atenea · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#12151c;--line:#232835;--fg:#e8eaf0;--mut:#8a91a3;--acc:#c8a75a;--acc2:#e7cf8f;--err:#ef6b6b}
:root[data-theme="light"]{--bg:#f4f2ec;--panel:#fff;--line:#e2ded3;--fg:#1c1d22;--mut:#6c6f7a;--acc:#a8842f;--acc2:#7d6120}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1d2333 0%,var(--bg) 60%);color:var(--fg);
 font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:16px}
:root[data-theme="light"] body{background:radial-gradient(1200px 600px at 50% -10%,#fff 0%,var(--bg) 60%)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px 32px;
 box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 18px;
 background:linear-gradient(145deg,#2a2f3d,#171a22);border:1px solid var(--line)}
h1{font-size:22px;font-weight:700;text-align:center;margin:0;letter-spacing:-.01em}
p.sub{color:var(--mut);text-align:center;margin:6px 0 28px;font-size:14px}
label{font-size:13px;color:var(--mut);font-weight:500;display:block;margin-bottom:6px}
.field{position:relative}
input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);
 font:inherit;padding:0 44px 0 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
.eye{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;background:none;color:var(--mut);cursor:pointer;border-radius:8px}
.eye:hover{color:var(--fg)}
button.go{margin-top:18px;width:100%;height:46px;border:0;border-radius:12px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;
 color:#17140c;background:linear-gradient(180deg,var(--acc2),var(--acc));transition:filter .15s,transform .05s}
button.go:hover{filter:brightness(1.05)}button.go:active{transform:translateY(1px)}button.go:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:10px;text-align:center}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:22px}
</style></head><body>
<form class="card" id="f" autocomplete="on">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e7cf8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4l3 3M19 4l-3 3"/><path d="M5 8c0-2 3-3 7-3s7 1 7 3v6c0 4-3 7-7 7s-7-3-7-7z"/>
    <circle cx="9" cy="11" r="2"/><circle cx="15" cy="11" r="2"/><path d="M12 13l-1 2h2z"/></svg></div>
  <h1>Atenea</h1>
  <p class="sub">Your local assistant on ZEUS</p>
  <input type="text" name="username" value="sergio" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <div class="field"><input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="button" class="eye" id="eye" aria-label="Show password">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button class="go" id="go">Sign in</button>
  <div class="err" id="err"></div>
  <div class="foot">You'll stay signed in on this device for 30 days.</div>
</form>
<script>
if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';
const $=s=>document.querySelector(s);
$('#eye').onclick=()=>{const i=$('#pw');i.type=i.type==='password'?'text':'password';i.focus();};
$('#f').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#err').textContent='';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
    if(r.ok){location.href='/';return;}
    const j=await r.json().catch(()=>({}));$('#err').textContent=j.detail||'Could not sign in';}
  catch(_){$('#err').textContent='Cannot reach ZEUS';}
  $('#go').disabled=false;$('#pw').select();};
</script></body></html>
