[project]
name = "atenea-sdk"
version = "0.3.0"
description = "Atenea SDK: agentes para modelos locales. Incluye Atenea (asistente) y Atenea Código (CLI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atenea = "atenea.codigo.cli:main"

[project.optional-dependencies]
mcp = ["mcp<2"]
app = ["fastapi", "uvicorn[standard]", "pywebpush", "python-docx", "openpyxl", "markdown", "numpy", "pillow"]
codigo = ["prompt_toolkit", "qrcode"]
web = ["atenea-sdk[app]"]
cli = ["atenea-sdk[codigo]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atenea", "atenea.app", "atenea.codigo"]

[tool.setuptools.package-data]
atenea = ["agents/*.md"]
"atenea.app" = ["web.html", "login.html", "sw.js", "brand/*.svg", "brand/*.png"]
