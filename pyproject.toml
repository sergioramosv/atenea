[project]
name = "atenea-sdk"
version = "0.3.0"
description = "Lightweight agent SDK for local models, with a Telegram bot (Hermes) and a web panel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atenea = "atenea.codigo.cli:main"

[project.optional-dependencies]
mcp = ["mcp<2"]
web = ["fastapi", "uvicorn[standard]", "pywebpush"]
cli = ["prompt_toolkit", "qrcode"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atenea", "atenea.app", "atenea.codigo"]

[tool.setuptools.package-data]
atenea = ["agents/*.md"]
"atenea.app" = ["web.html", "login.html", "sw.js", "brand/*.svg", "brand/*.png"]
