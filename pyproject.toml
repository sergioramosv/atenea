[project]
name = "athena-agent"
version = "0.3.0"
description = "Lightweight agent SDK for local models, with a Telegram bot (Hermes) and a web panel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp<2"]
web = ["fastapi", "uvicorn[standard]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["athena"]

[tool.setuptools.package-data]
athena = ["web.html", "login.html", "brand/*.svg"]
